# SDMR Experiment — Gaussian Blur (severity 0.7)
# Tests SDMR multi-scale unsharp masking / Wiener deconvolution

experiment_name: "coco_blur_0_7"
seed: 42
strategy: "sdmr"
output_dir: "./outputs"

data:
  dataset: "coco_person"
  dataset_dir: "./data/coco2017"
  images_dir: "./data/coco2017/val2017"
  annotations_file: "./data/coco2017/annotations/instances_val2017.json"
  min_area: 100.0
  num_images: null

model:
  name: "yolov8s.pt"
  device: "cuda:0"
  imgsz: 640
  conf_threshold: 0.25
  iou_threshold: 0.45
  verbose: false

stream:
  window_size: 32
  warmup_frames: 0
  scenario:
    type: "abrupt"
    clean_before: 300
    shift_length: 300
    clean_after: 300
    shift_family: "gaussian_blur"
    severity: 0.7

router:
  input_drift_threshold: 0.3
  output_drift_threshold: 0.3
  feature_drift_threshold: 0.3
  mild_severity: 0.3
  moderate_severity: 0.6
  severe_threshold: 0.8
  cooldown_frames: 10
  cost_aware: true
  budget_per_window: 10.0
  cost_weight: 0.3

diagnosis:
  buffer_size: 200
  anchor_warmup: 100
  extract_features: false
  monitor_signals:
    - brightness_mean
    - confidence_mean
    - detection_count
  fusion: "any"

adaptation:
  input_adapt_threshold: 0.3
  base_lr: 0.0001
  max_steps: 5
  grad_clip: 1.0

restoration:
  denoise_method: "cascade"
  nlm_h_scale: 1.0
  enable_confidence_gate: true
  enable_compound: true

tta:
  lr: 0.001
  steps: 1
  episodic: false

baseline:
  period: 50
  budget: 3
