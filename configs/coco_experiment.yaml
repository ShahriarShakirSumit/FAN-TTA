# SDMR Experiment Configuration for COCO-Person
# Usage: python -m sdmr.run_stream_experiment --config configs/coco_experiment.yaml

experiment_name: "coco_person_abrupt_noise"
seed: 42
strategy: "sdmr"  # sdmr, no_adapt, bn_adapt, periodic_ft, tent, eata, cotta, sar, rotta
output_dir: "./outputs"

# Dataset
data:
  dataset: "coco_person"
  dataset_dir: "./data/coco2017"
  images_dir: "./data/coco2017/val2017"
  annotations_file: "./data/coco2017/annotations/instances_val2017.json"
  min_area: 100.0
  num_images: null  # null = use all (~2700 person images), set lower for quick tests

# Model
model:
  name: "yolov8s.pt"
  device: "cuda:0"
  imgsz: 640
  conf_threshold: 0.25
  iou_threshold: 0.45
  verbose: false

# Stream configuration
stream:
  window_size: 32
  warmup_frames: 0
  scenario:
    type: "abrupt"             # abrupt, gradual, recurring, mixed, clean
    clean_before: 300          # frames before shift
    shift_length: 300          # duration of shift
    clean_after: 300           # frames after shift
    shift_family: "gaussian_noise"  # gaussian_noise, gaussian_blur, brightness, contrast, fog, snow, rain
    severity: 0.5              # 0.0-1.0

# SDMR Router
router:
  input_drift_threshold: 0.3
  output_drift_threshold: 0.3
  feature_drift_threshold: 0.3
  mild_severity: 0.3
  moderate_severity: 0.6
  severe_threshold: 0.8
  cooldown_frames: 10
  cost_aware: true
  budget_per_window: 10.0
  cost_weight: 0.3

# Diagnosis
diagnosis:
  buffer_size: 200
  anchor_warmup: 100           # frames of clean data to establish baseline
  extract_features: false      # set true for feature-level signals (slower)
  monitor_signals:
    - brightness_mean
    - confidence_mean
    - detection_count
  fusion: "any"

# Adaptation parameters
adaptation:
  input_adapt_threshold: 0.3  # Drift threshold for input preprocessing activation
  base_lr: 0.0001
  max_steps: 5
  grad_clip: 1.0

# SCAR restoration (used when strategy is sdmr)
restoration:
  denoise_method: "cascade"
  nlm_h_scale: 1.0
  enable_confidence_gate: true
  enable_compound: true

# TTA baseline configs (used when strategy is tent/eata/cotta/sar/rotta)
tta:
  lr: 0.001
  steps: 1
  episodic: false
  fisher_alpha: 2000
  ema_decay: 0.999
  num_augmentations: 4
  sam_rho: 0.05
  bn_alpha: 0.5
  memory_size: 256

# Simple baseline configs (used when strategy is periodic_ft etc.)
baseline:
  period: 50           # PeriodicFT: adapt every N frames
  budget: 3            # PeriodicFT: gradient steps per adaptation
