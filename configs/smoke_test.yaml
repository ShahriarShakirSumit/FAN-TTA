# Quick CPU smoke test of the full SDMR pipeline.
# Runs a minimal experiment (5 images, 15 frames) on CPU to validate
# the entire end-to-end pipeline works before submitting GPU jobs.

seed: 42
experiment_name: "smoke_test"
strategy: "sdmr"

data:
  dataset: "coco_person"
  dataset_dir: "./data/coco2017"
  num_images: 5
  min_area: 100.0

model:
  name: "yolov8n.pt"    # Nano model for CPU speed
  device: "cpu"
  imgsz: 320            # Small size for speed
  conf_threshold: 0.25
  verbose: false

stream:
  scenario:
    type: "abrupt"
    clean_before: 5
    shift_length: 5
    clean_after: 5
    shift_family: "gaussian_noise"
    severity: 0.5
  window_size: 8
  warmup_frames: 0

diagnosis:
  buffer_size: 50
  anchor_warmup: 4
  monitor_signals:
    - "brightness_mean"
    - "confidence_mean"
    - "detection_count"
  fusion: "any"
  extract_features: false

router:
  cost_aware: true
  budget_per_window: 10.0
  cooldown_frames: 3

harm:
  n_bins: 5
  horizon: 10

adaptation:
  input_adapt_threshold: 0.3  # Drift threshold for input preprocessing activation

restoration:
  denoise_method: "cascade"
  nlm_h_scale: 1.0
  enable_confidence_gate: true
  enable_compound: true

output_dir: "./outputs/smoke_test"
